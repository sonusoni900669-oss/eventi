<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Emerald Event</title>

<style>
:root {
    --premium-gold: #ffd700;
    --emerald-green: #00ff88;
    
    /* 🛠️ ADJUSTMENT CONTROL (Rules ko upar-niche karne ke liye yahan change karein) */
    --rules-top-position: 65%; /* Rules ko angel.png par kahan dikhana hai */
}

* { box-sizing: border-box; }
html, body { width: 100%; margin: 0; padding: 0; background: #000; overflow-x: hidden; }
body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: white; }

.wrapper { 
    width: 100%; 
    max-width: 480px; 
    margin: 0 auto; 
    min-height: 100vh; 
    background: #000;
}

.event-content { 
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

/* --- BANNER SECTION (Rules ab iske andar hain) --- */
.banner-section {
    width: 100%;
    position: relative;
    display: flex;
    justify-content: center;
}
.bg-banner { width: 100%; display: block; }

.gift-center-img { 
    position: absolute; 
    top: 54%; 
    left: 50%;
    transform: translateX(-50%);
    width: 50%; 
    z-index: 5; 
    animation: bounce 3s ease-in-out infinite; 
}

/* 📜 Rules inside Angel.png */
.premium-rules { 
    position: absolute;
    top: var(--rules-top-position);
    width: 90%;
    text-align: center;
    z-index: 10;
}
.rules-header {
    font-size: 18px;
    font-weight: 900;
    color: var(--premium-gold);
    text-transform: uppercase;
    margin-bottom: 5px;
    display: block;
    letter-spacing: 1px;
}
.rules-body { 
    font-size: 12px; 
    background: rgba(0, 0, 0, 0.6); /* Text clear dikhne ke liye halka shadow */
    padding: 8px; 
    border-radius: 10px;
    line-height: 1.4;
    color: #fff;
    border: 1px solid rgba(255, 215, 0, 0.2);
}

/* --- BOTTOM CONTAINER --- */
.bottom-container {
    width: 100%;
    background-image: url('bottom.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 120px;
    margin-top: -5px; /* Gap khatam karne ke liye */
}

.timer-box { display: flex; gap: 12px; margin-top: 20px; }
.time-unit { text-align: center; min-width: 45px; }
.time-num { font-size: 26px; font-weight: 900; color: var(--premium-gold); display: block; }
.time-label { font-size: 9px; text-transform: uppercase; opacity: 0.8; }

.podium-section { 
    width: 100%; 
    height: 160px; 
    display: flex; 
    justify-content: center; 
    align-items: flex-end; 
    gap: 8px;
    padding: 0 10px;
    margin-top: 30px;
}
.podium-base { 
    background: linear-gradient(180deg, #0a4d21 0%, #001a0a 100%); 
    border: 1px solid rgba(0,255,136,0.3); 
    border-radius: 8px 8px 0 0; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    font-weight: 900; 
    color: var(--premium-gold);
    position: relative;
}
.p-rank1 { width: 32%; height: 90px; order: 2; font-size: 20px;}
.p-rank2 { width: 28%; height: 70px; order: 1; font-size: 16px;}
.p-rank3 { width: 28%; height: 55px; order: 3; font-size: 14px;}

.profile { position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%); width: 55px; height: 55px; }
.avatar-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--premium-gold); object-fit: cover; }

.list-container { width: 100%; padding: 20px 15px; }
.rank-item { display: flex; align-items: center; padding: 10px; background: rgba(255,255,255,0.07); margin-bottom: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
.rank-n { width: 25px; font-weight: bold; color: #aaa; }
.list-avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--premium-gold); margin: 0 12px; }
.user-name { flex-grow: 1; font-size: 14px; font-weight: 500; }
.gift-val { color: var(--premium-gold); font-weight: bold; font-size: 13px; }

.join-btn { 
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
    width: 85%; max-width: 320px; padding: 15px; 
    background: linear-gradient(45deg, #00ff88, #009955); 
    border-radius: 50px; color: black; font-weight: 800; text-align: center; text-decoration: none; z-index: 1000;
    box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
}

@keyframes bounce { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }
</style>
</head>
<body>

<div class="wrapper">
    <div class="event-content">
        <div class="banner-section">
            <img src="angel.png" class="bg-banner">
            <img src="gift.png" class="gift-center-img">
            
            <div class="premium-rules">
                <span class="rules-header">.G𝚊𝚖𝚎 Ru𝚕𝚎𝚜.</span>
                <div class="rules-body">
                    <div>✨ 𝚃𝚘𝚙 𝟷 — 𝟹% 𝙲𝚑𝚊𝚛𝚖𝚜 𝚘𝚏 𝚝𝚘𝚝𝚊𝚕 𝙰𝚗𝚐𝚎𝚕 𝙶𝚒𝚏𝚝.</div>
                    <div>✨ 𝚃𝚘𝚙 𝟸 — 𝟸% 𝙲𝚑𝚊𝚛𝚖𝚜 𝚘𝚏 𝚝𝚘𝚝𝚊𝚕 𝙰𝚗𝚐𝚎𝚕 𝙶𝚒𝚏𝚝.</div>
                    <div>✨ 𝚃𝚘𝚙 𝟹 — 𝟷% 𝙲𝚑𝚊𝚛𝚖𝚜 𝚘𝚏 𝚝𝚘𝚝𝚊𝚕 𝙰𝚗𝚐𝚎𝚕 𝙶𝚒𝚏𝚝.</div>
                </div>
            </div>
        </div>

        <div class="bottom-container">
            <div class="timer-box">
                <div class="time-unit"><span class="time-num" id="days">00</span><span class="time-label">Days</span></div>
                <div class="time-unit"><span class="time-num" id="hours">00</span><span class="time-label">Hrs</span></div>
                <div class="time-unit"><span class="time-num" id="mins">00</span><span class="time-label">Min</span></div>
                <div class="time-unit"><span class="time-num" id="secs">00</span><span class="time-label">Sec</span></div>
            </div>

            <div class="podium-section">
                <div class="podium-base p-rank2"><div id="p2-avatar"></div>2nd</div>
                <div class="podium-base p-rank1"><div id="p1-avatar"></div>1st</div>
                <div class="podium-base p-rank3"><div id="p3-avatar"></div>3rd</div>
            </div>

            <div class="list-container">
                <div id="rank-list-items"></div>
            </div>
        </div>
    </div>
</div>

<a href="#" class="join-btn">🚀 JOIN & PURCHASE</a>

<script>
    const users = Array.from({length: 10}, (_, i) => ({
        name: `User_Rank_${i+1}`,
        gifts: 2500 - (i * 150),
        img: `https://i.pravatar.cc/100?u=${i}`
    }));

    function render() {
        document.getElementById('p1-avatar').innerHTML = `<div class="profile"><img class="avatar-img" src="${users[0].img}"></div>`;
        document.getElementById('p2-avatar').innerHTML = `<div class="profile"><img class="avatar-img" src="${users[1].img}"></div>`;
        document.getElementById('p3-avatar').innerHTML = `<div class="profile"><img class="avatar-img" src="${users[2].img}"></div>`;

        const listHtml = users.slice(3, 10).map((user, i) => `
            <div class="rank-item">
                <div class="rank-n">${i + 4}</div>
                <img class="list-avatar" src="${user.img}">
                <div class="user-name">${user.name}</div>
                <div class="gift-val">${user.gifts} 💎</div>
            </div>
        `).join('');
        document.getElementById('rank-list-items').innerHTML = listHtml;
    }

    function startTimer() {
        const target = new Date().getTime() + (7 * 24 * 60 * 60 * 1000); 
        setInterval(() => {
            const now = new Date().getTime();
            const diff = target - now;
            document.getElementById('days').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2,'0');
            document.getElementById('hours').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2,'0');
            document.getElementById('mins').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2,'0');
            document.getElementById('secs').innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2,'0');
        }, 1000);
    }

    render();
    startTimer();
</script>
</body>
</html>
